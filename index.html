        // Escape special characters before making a phrase regex.
        function escapeRegex(text) {
            return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Replace phrases first, then individual words.
        // The longest phrases are checked first so a shorter entry
        // cannot accidentally replace part of a longer phrase.
        function translateWithPhrases(input, phraseBank, wordBank) {
            let output = input;

            const phraseEntries = Object.entries(phraseBank)
                .sort((a, b) => b[0].length - a[0].length);

            for (const [source, target] of phraseEntries) {
                const escaped = escapeRegex(source);

                output = output.replace(
                    new RegExp('(^|\\s)' + escaped + '(?=\\s|[.!?,;:]|$)', 'gi'),
                    '$1' + target
                );
            }

            // Translate remaining individual words/entries.
            const wordEntries = Object.entries(wordBank)
                .sort((a, b) => b[0].length - a[0].length);

            for (const [source, target] of wordEntries) {
                const escaped = escapeRegex(source);

                output = output.replace(
                    new RegExp('(^|\\s)' + escaped + '(?=\\s|[.!?,;:]|$)', 'gi'),
                    '$1' + target
                );
            }

            return output;
        }

        // Apply dictionary pronunciations to a Tausug sentence.
        function makeTausugPronunciation(text) {
            let spoken = text.toLowerCase();

            const entries = Object.entries(tausugPronunciation)
                .sort((a, b) => b[0].length - a[0].length);

            for (const [word, pronunciation] of entries) {
                const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                spoken = spoken.replace(
                    new RegExp('(^|\\s)' + escaped + '(?=\\s|$)', 'gi'),
                    '$1' + pronunciation
                );

            }

            return spoken;
        }

        // Try to find a browser voice suitable for the requested language.
        function chooseVoice(lang) {
            const voices = speechSynthesis.getVoices();

            if (lang === 'en-US') {
                return voices.find(v => v.lang.toLowerCase().startsWith('en-us')) ||
                       voices.find(v => v.lang.toLowerCase().startsWith('en')) ||
                       null;
            }

            return null;
        }

        function speakText(text, direction) {
            if (!text || !('speechSynthesis' in window)) {
                alert('Text-to-speech is not supported by this browser.');
                return;
            }

            speechSynthesis.cancel();

            const isTausug = direction === 'en-to-tausug';
            const speechText = isTausug
                ? makeTausugPronunciation(text)
                : text;

            const speech = new SpeechSynthesisUtterance(speechText);

            speech.lang = isTausug ? 'en-US' : 'en-US';
            speech.rate = isTausug ? 0.82 : 0.9;
            speech.pitch = 1;

            const voice = chooseVoice(speech.lang);
            if (voice) speech.voice = voice;

            speechSynthesis.speak(speech);

            document.getElementById('stopButton').disabled = false;

            speech.onend = () => {
                document.getElementById('stopButton').disabled = true;
            };

            speech.onerror = () => {
                document.getElementById('stopButton').disabled = true;
            };
        }

        function translateText() {
            const input = document.getElementById('inputText').value.trim();
            const direction = document.getElementById('direction').value;

            const wordBank = direction === 'en-to-tausug'
                ? wordBankEnToTausug
                : wordBankTausugToEn;

            const phraseBank = direction === 'en-to-tausug'
                ? phraseBankEnToTausug
                : phraseBankTausugToEn;

            // Phrases are checked first. If no phrase matches,
            // the normal word bank is used for the remaining text.
            const output = translateWithPhrases(
                input,
                phraseBank,
                wordBank
            );

            document.getElementById('output').innerHTML =
                `<strong>Translated:</strong> ${output || '(no text entered)'}`;

            // TTS remains manual: Translate does NOT automatically speak.
            document.getElementById('speakButton').disabled = !output;
        }

        function speakTranslation() {
            const direction = document.getElementById('direction').value;
            const outputElement = document.getElementById('output');
            const translatedText = outputElement.innerText
                .replace(/^Translated:\s*/i, '')
                .trim();

            if (!translatedText || translatedText === '(no text entered)') {
                return;
            }

            speakText(translatedText, direction);
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
            document.getElementById('stopButton').disabled = true;
        }

        // Load voices when the browser makes them available.
        if ('speechSynthesis' in window) {
            speechSynthesis.onvoiceschanged = () => {
                speechSynthesis.getVoices();
            };
        }

    <!-- Local browser STT: Transformers.js + multilingual Whisper.
         Inference runs in the browser after the model is downloaded/cached. -->
    <script type="module">
        import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";

        let localTranscriber = null;
        let sttLoading = false;
        let sttRecording = false;
        let mediaRecorder = null;
        let mediaStream = null;
        let recordedChunks = [];

        const STT_MODEL = "Xenova/whisper-tiny";

        function setSTTStatus(message) {
            const status = document.getElementById("sttStatus");
            if (status) status.textContent = message;
        }

        function setSTTButton(text, disabled = false) {
            const button = document.getElementById("sttButton");
            if (button) {
                button.textContent = text;
                button.disabled = disabled;
            }
        }

        async function loadLocalSTT() {
            if (localTranscriber) return localTranscriber;
            if (sttLoading) return null;

            sttLoading = true;
            setSTTButton("⏳ Loading STT...", true);
            setSTTStatus("Downloading/loading local Whisper model...");

            try {
                localTranscriber = await pipeline(
                    "automatic-speech-recognition",
                    STT_MODEL
                );

                setSTTStatus("STT ready — speech is processed in your browser.");
                setSTTButton("🎤 Start Local STT");
                return localTranscriber;
            } catch (error) {
                console.error("STT model error:", error);
                setSTTStatus("Could not load STT model.");
                setSTTButton("🎤 Start Local STT");
                alert(
                    "The local STT model could not be loaded. " +
                    "Check your internet connection and browser console."
                );
                return null;
            } finally {
                sttLoading = false;
            }
        }

        async function toggleLocalSTT() {
            if (sttRecording) {
                stopLocalSTT();
            } else {
                await startLocalSTT();
            }
        }

        async function startLocalSTT() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert(
                    "Microphone access is unavailable here. " +
                    "Use Chrome/Edge and open the page from localhost or HTTPS."
                );
                return;
            }

            const transcriber = await loadLocalSTT();
            if (!transcriber) return;

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(mediaStream);

                mediaRecorder.ondataavailable = event => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    let audioContext = null;

                    try {
                        setSTTButton("⏳ Transcribing...", true);
                        setSTTStatus("Converting recording and transcribing locally...");

                        const blob = new Blob(recordedChunks, {
                            type: mediaRecorder.mimeType || "audio/webm"
                        });

                        const arrayBuffer = await blob.arrayBuffer();
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        audioContext = new AudioCtx();

                        const decoded = await audioContext.decodeAudioData(arrayBuffer);

                        // Whisper expects 16 kHz mono audio.
                        let audioData;

                        if (decoded.sampleRate === 16000 && decoded.numberOfChannels === 1) {
                            audioData = decoded.getChannelData(0);
                        } else {
                            const targetLength = Math.ceil(decoded.duration * 16000);
                            const offlineContext = new OfflineAudioContext(
                                1,
                                targetLength,
                                16000
                            );

                            const source = offlineContext.createBufferSource();
                            source.buffer = decoded;
                            source.connect(offlineContext.destination);
                            source.start(0);

                            const rendered = await offlineContext.startRendering();
                            audioData = rendered.getChannelData(0);
                        }

                        const direction = document.getElementById("direction").value;
                        const options = {
                            chunk_length_s: 30,
                            stride_length_s: 5
                        };

                        // Whisper has no dedicated Tausug language code.
                        // For English input we can explicitly guide it to English.
                        if (direction === "en-to-tausug") {
                            options.language = "english";
                            options.task = "transcribe";
                        }

                        const result = await transcriber(audioData, options);
                        const text = (result.text || "").trim();

                        if (text) {
                            const input = document.getElementById("inputText");
                            input.value = text;
                            input.focus();
                            setSTTStatus("Done. Edit the text or click Translate.");
                        } else {
                            setSTTStatus("No speech recognized. Try again.");
                        }
                    } catch (error) {
                        console.error("Local STT transcription error:", error);
                        setSTTStatus("STT transcription failed.");
                        alert(
                            "I couldn't transcribe that recording. " +
                            "Try a shorter recording and check your microphone."
                        );
                    } finally {
                        if (audioContext) {
                            try { await audioContext.close(); } catch (_) {}
                        }
                        setSTTButton("🎤 Start Local STT");
                    }
                };

                mediaRecorder.start();
                sttRecording = true;
                setSTTButton("⏹ Stop & Transcribe");
                setSTTStatus("Listening... speak now.");

            } catch (error) {
                console.error("Microphone error:", error);
                setSTTStatus("Microphone access was not granted.");
                setSTTButton("🎤 Start Local STT");
                alert(
                    "Microphone access was not granted. " +
                    "Allow microphone permission and try again."
                );
            }
        }

        function stopLocalSTT() {
            if (!mediaRecorder || mediaRecorder.state === "inactive") return;

            sttRecording = false;
            setSTTStatus("Stopping recording...");
            mediaRecorder.stop();

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        window.toggleLocalSTT = toggleLocalSTT;
        window.startLocalSTT = startLocalSTT;
        window.stopLocalSTT = stopLocalSTT;

        // Start loading the model as the page opens.
        loadLocalSTT();
    </script>

</body>
</html>
